[package]
name = "rf-raws"
description = "Parser for DF raw files (objects + graphics raws) read from the user's own DF install"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rf-core.workspace = true

[target.'cfg(windows)'.dependencies]
# Steam's install folder from the registry (finding the DF install, see src/dfdir.rs).
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Registry"] }
