[package]
name = "rf-sim"
description = "Deterministic fortress simulation (tick loop, pathfinding, units, jobs, needs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rf-core.workspace = true
rayon = "1"
serde = { workspace = true, features = ["rc"] } # [saves10] module state in World::sim_state; rc: Arc<str> in combat layers
serde_json.workspace = true # [saves10]
rmp-serde = "1" # [saves11] exact runtime snapshot (MessagePack, named fields)

[features]
prof = [] # [perf11] cycle counters for hot functions (`rf_sim::prof_report`), off by default

[dev-dependencies]
rf-import.workspace = true
serde_json.workspace = true # [combat] siege example reads the round-3 raws
bincode = "1.3" # [chaos10] save/load round trips like rf-app
zstd = "0.13" # [saves11] saveload example: compressed snapshot sizes

[[example]]
name = "siege"
path = "examples/siege.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "fort"
path = "examples/fort.rs"

[[example]]
name = "defense" # [defense] sieges against the real fort's doors, bridges and traps
path = "examples/defense.rs"

[[example]]
name = "construct" # [construct] constructions, smoothing, engraving, dumping on the real fort
path = "examples/construct.rs"

[[example]]
name = "minecarts" # [carts12] hauling routes (guided ore cart, pushed track) on the real fort
path = "examples/minecarts.rs"
