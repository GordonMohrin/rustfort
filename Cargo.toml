[workspace]
resolver = "2"
members = [
    "crates/rf-core",
    "crates/rf-raws",
    "crates/rf-gfx",
    "crates/rf-import",
    "crates/rf-sim",
    "crates/rf-app",
    "crates/rf-save-v09", # [saves10] frozen v0.9 save types (old-save converter)
]

[workspace.package]
version = "0.12.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GordonMohrin/rustfort"
description = "Clean-room Rust re-implementation of Dwarf Fortress fortress mode that continues a real DF fort"
publish = false

[workspace.dependencies]
rf-core = { path = "crates/rf-core" }
rf-raws = { path = "crates/rf-raws" }
rf-gfx = { path = "crates/rf-gfx" }
rf-import = { path = "crates/rf-import" }
rf-sim = { path = "crates/rf-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
